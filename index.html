<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Chi Tiêu">
    
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2382/2382625.png">
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/2382/2382625.png">
    
    <title>Quản Lý Chi Tiêu</title>
    <style>
        :root {
            --bg-color: #F2F2F7;
            --card-bg: #FFFFFF;
            --primary: #007AFF;
            --danger: #FF3B30;
            --text-main: #000000;
            --text-sub: #8E8E93;
        }
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
        }
        body {
            margin: 0 auto;
            max-width: 500px; 
            padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom) 16px;
            background-color: var(--bg-color);
            color: var(--text-main);
            user-select: none;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
            min-height: 100vh;
        }
        h1 {
            font-size: 24px;
            font-weight: 700;
            margin: 16px 0 12px 0;
            text-align: center;
        }
        .total-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 12px 16px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            margin-bottom: 12px;
        }
        .total-label {
            font-size: 13px;
            color: var(--text-sub);
            margin-bottom: 4px;
            font-weight: 600;
        }
        .total-amount {
            font-size: 28px;
            font-weight: 800;
            color: var(--danger);
        }
        .form-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 12px 16px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .input-group {
            margin-bottom: 10px;
        }
        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-sub);
            margin-bottom: 4px;
        }
        .input-with-btn {
            position: relative;
            display: flex;
            align-items: center;
        }
        .input-with-btn input {
            width: 100%;
            padding: 10px 38px 10px 12px; 
            border: 1px solid #E5E5EA;
            border-radius: 10px;
            font-size: 15px;
            background: #FAFAFC;
            outline: none;
        }
        .input-with-btn input:focus {
            border-color: var(--primary);
        }
        .backspace-btn {
            position: absolute;
            right: 6px;
            background: #E5E5EA;
            color: var(--text-sub);
            border: none;
            width: 26px;
            height: 26px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 14px;
        }
        .backspace-btn:active {
            background: #D1D1D6;
        }
        select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #E5E5EA;
            border-radius: 10px;
            font-size: 15px;
            background: #FAFAFC;
            outline: none;
        }
        select:focus {
            border-color: var(--primary);
        }
        .date-select-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px;
        }
        button.add-btn {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 4px;
        }
        button.add-btn:active {
            opacity: 0.8;
        }
        button.add-btn.update-mode {
            background: #34C759;
        }
        .list-header {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .expense-list {
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            margin-bottom: 20px;
        }
        .expense-item {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 10px 12px;
            border-bottom: 1px solid #E5E5EA;
        }
        .expense-item:last-child {
            border-bottom: none;
        }
        /* Nới rộng tối đa cho phần Tên khoản chi */
        .item-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
            overflow: hidden;
            padding-right: 12px;
        }
        .item-name {
            font-size: 15px;
            font-weight: 600;
            word-wrap: break-word;
        }
        .item-meta {
            font-size: 12px;
            color: var(--text-sub);
        }
        /* Gom gọn phần Số tiền và Nút sửa/xóa sang góc phải */
        .item-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
            flex-shrink: 0;
        }
        .item-amount {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-main);
        }
        .action-btns {
            display: flex;
            gap: 6px;
        }
        .edit-btn {
            background: #E8F1FC;
            color: var(--primary);
            border: none;
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }
        .delete-btn {
            background: #FFE5E5;
            color: var(--danger);
            border: none;
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }
        .empty-text {
            text-align: center;
            padding: 20px;
            color: var(--text-sub);
            font-size: 14px;
        }
        .month-group {
            background: var(--card-bg);
            border-radius: 16px;
            margin-bottom: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            overflow: hidden;
        }
        .month-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: #FAFAFC;
            cursor: pointer;
            border-bottom: 1px solid transparent;
        }
        .month-header.active {
            border-bottom-color: #E5E5EA;
        }
        .month-title {
            font-size: 15px;
            font-weight: 600;
        }
        .month-total {
            font-size: 15px;
            font-weight: 700;
            color: var(--danger);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .toggle-icon {
            font-size: 10px;
            color: var(--text-sub);
            transition: transform 0.2s;
        }
        .month-header.active .toggle-icon {
            transform: rotate(180deg);
        }
        .month-content {
            display: none;
        }
        .month-content.show {
            display: block;
        }
        .footer-copyright {
            text-align: center;
            font-style: italic;
            color: var(--text-sub);
            font-size: 12px;
            margin: 10px 0 20px 0;
        }
    </style>
</head>
<body>

    <h1>Quản Lý Chi Tiêu</h1>

    <div class="total-card">
        <div class="total-label" id="topMonthLabel">Tổng chi tiêu tháng này</div>
        <div class="total-amount" id="totalAmount">0 ₫</div>
    </div>

    <div class="form-card">
        <div class="input-group">
            <div class="date-select-row">
                <select id="selDay"></select>
                <select id="selMonth"></select>
                <select id="selYear"></select>
            </div>
        </div>
        
        <div class="input-group">
            <div class="input-with-btn">
                <input type="text" id="expenseName" placeholder="Tên khoản chi (VD: Ăn trưa, Đổ xăng)">
                <button type="button" class="backspace-btn" onclick="removeLastChar('expenseName')">⌫</button>
            </div>
        </div>
        
        <div class="input-group">
            <div class="input-with-btn">
                <input type="text" id="expenseAmount" placeholder="Số tiền (VD: 50.000)" inputmode="numeric" oninput="formatInputNumber(event)">
                <button type="button" class="backspace-btn" onclick="removeLastChar('expenseAmount')">⌫</button>
            </div>
        </div>
        
        <div class="input-group">
            <select id="expenseCategory">
                <option value="🍜 Ăn uống">🍜 Ăn uống</option>
                <option value="🛵 Di chuyển">🛵 Di chuyển</option>
                <option value="🛍️ Mua sắm">🛍️ Mua sắm</option>
                <option value="🧾 Hóa đơn">🧾 Hóa đơn</option>
                <option value="🎮 Giải trí">🎮 Giải trí</option>
                <option value="📦 Khác">📦 Khác</option>
            </select>
        </div>
        <button class="add-btn" id="submitBtn" onclick="saveExpense()">+ Thêm Khoản Chi</button>
    </div>

    <!-- Danh sách lịch sử RÚT GỌN (1 giao dịch gần nhất) -->
    <div class="list-header">Giao dịch gần nhất</div>
    <div class="expense-list" id="recentList"></div>

    <!-- Thống kê theo tháng XỔ XUỐNG -->
    <div class="list-header">Chi tiết theo tháng</div>
    <div id="monthlyAccordion"></div>

    <div class="footer-copyright">
        © 2026 - Nguyễn Hữu Thành
    </div>

    <script>
        let expenses = JSON.parse(localStorage.getItem('my_expenses_v1')) || [];
        let editIndex = -1; 

        function initDates() {
            const dSel = document.getElementById('selDay');
            const mSel = document.getElementById('selMonth');
            const ySel = document.getElementById('selYear');
            const now = new Date();
            
            dSel.innerHTML = ''; mSel.innerHTML = ''; ySel.innerHTML = '';

            for (let i = 1; i <= 31; i++) {
                dSel.innerHTML += `<option value="${i}" ${i === now.getDate() ? 'selected' : ''}>${i}</option>`;
            }
            for (let i = 1; i <= 12; i++) {
                mSel.innerHTML += `<option value="${i}" ${i === now.getMonth() + 1 ? 'selected' : ''}>Tháng ${i}</option>`;
            }
            for (let i = 2026; i <= 2050; i++) {
                ySel.innerHTML += `<option value="${i}" ${i === now.getFullYear() ? 'selected' : ''}>${i}</option>`;
            }
        }

        function formatVND(amount) {
            return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(amount);
        }

        function formatInputNumber(e) {
            let val = e.target.value.replace(/\D/g, '');
            if (val !== '') {
                e.target.value = new Intl.NumberFormat('vi-VN').format(val);
            } else {
                e.target.value = '';
            }
        }

        function removeLastChar(inputId) {
            const input = document.getElementById(inputId);
            if (!input.value) return;

            if (inputId === 'expenseAmount') {
                let raw = input.value.replace(/\D/g, ''); 
                raw = raw.slice(0, -1); 
                input.value = raw ? new Intl.NumberFormat('vi-VN').format(raw) : ''; 
            } else {
                input.value = input.value.slice(0, -1);
            }
        }

        function renderExpenses() {
            const recentEl = document.getElementById('recentList');
            const monthlyEl = document.getElementById('monthlyAccordion');
            const totalEl = document.getElementById('totalAmount');
            const topMonthLabel = document.getElementById('topMonthLabel');

            let monthlyStats = {};
            expenses.forEach((item, index) => {
                let parts = item.date.split('/');
                if (parts.length >= 3) {
                    let mKey = `${parts[1].padStart(2, '0')}/${parts[2]}`;
                    if (!monthlyStats[mKey]) {
                        monthlyStats[mKey] = { total: 0, items: [] };
                    }
                    monthlyStats[mKey].total += item.amount;
                    monthlyStats[mKey].items.push({ ...item, originalIndex: index });
                }
            });

            const now = new Date();
            const currentMonthKey = `${String(now.getMonth() + 1).padStart(2, '0')}/${now.getFullYear()}`;
            const currentMonthTotal = monthlyStats[currentMonthKey] ? monthlyStats[currentMonthKey].total : 0;
            
            topMonthLabel.innerText = `Tổng chi tiêu Tháng ${currentMonthKey}`;
            totalEl.innerText = formatVND(currentMonthTotal);

            if (expenses.length === 0) {
                recentEl.innerHTML = '<div class="empty-text">Chưa có khoản chi tiêu nào</div>';
                monthlyEl.innerHTML = '<div class="empty-text">Chưa có dữ liệu thống kê</div>';
                return;
            }

            let recent1 = expenses.slice(0, 1);
            recentEl.innerHTML = recent1.map((item, localIndex) => `
                <div class="expense-item">
                    <div class="item-info">
                        <span class="item-name">${item.name}</span>
                        <span class="item-meta">${item.category} • ${item.date}</span>
                    </div>
                    <div class="item-right">
                        <span class="item-amount">${formatVND(item.amount)}</span>
                        <div class="action-btns">
                            <button class="edit-btn" onclick="triggerEdit(${0})">Sửa</button>
                            <button class="delete-btn" onclick="deleteExpense(${0})">Xóa</button>
                        </div>
                    </div>
                </div>
            `).join('');

            monthlyEl.innerHTML = Object.keys(monthlyStats).map(mKey => `
                <div class="month-group">
                    <div class="month-header" onclick="toggleAccordion('${mKey}')" id="header-${mKey}">
                        <div class="month-title">Tháng ${mKey}</div>
                        <div class="month-total">
                            ${formatVND(monthlyStats[mKey].total)}
                            <span class="toggle-icon">▼</span>
                        </div>
                    </div>
                    <div class="month-content" id="content-${mKey}">
                        ${monthlyStats[mKey].items.map(item => `
                            <div class="expense-item">
                                <div class="item-info">
                                    <span class="item-name">${item.name}</span>
                                    <span class="item-meta">${item.category} • ${item.date}</span>
                                </div>
                                <div class="item-right">
                                    <span class="item-amount">${formatVND(item.amount)}</span>
                                    <div class="action-btns">
                                        <button class="edit-btn" onclick="triggerEdit(${item.originalIndex})">Sửa</button>
                                        <button class="delete-btn" onclick="deleteExpense(${item.originalIndex})">Xóa</button>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        function toggleAccordion(mKey) {
            const content = document.getElementById(`content-${mKey}`);
            const header = document.getElementById(`header-${mKey}`);
            content.classList.toggle('show');
            header.classList.toggle('active');
        }

        function saveExpense() {
            const nameInput = document.getElementById('expenseName');
            const amountInput = document.getElementById('expenseAmount');
            const categoryInput = document.getElementById('expenseCategory');
            const btn = document.getElementById('submitBtn');
            
            const d = document.getElementById('selDay').value.padStart(2, '0');
            const m = document.getElementById('selMonth').value.padStart(2, '0');
            const y = document.getElementById('selYear').value;

            const name = nameInput.value.trim();
            const amountStr = amountInput.value.replace(/\D/g, '');
            const amount = parseFloat(amountStr);

            if (!name || isNaN(amount) || amount <= 0) {
                alert('Vui lòng nhập tên khoản chi và số tiền hợp lệ!');
                return;
            }

            const formattedDate = `${d}/${m}/${y}`;
            const newItem = {
                name: name,
                amount: amount,
                category: categoryInput.value,
                date: formattedDate
            };

            if (editIndex > -1) {
                expenses[editIndex] = newItem;
                editIndex = -1; 
                btn.innerText = "+ Thêm Khoản Chi";
                btn.classList.remove('update-mode');
            } else {
                expenses.unshift(newItem);
            }

            localStorage.setItem('my_expenses_v1', JSON.stringify(expenses));
            nameInput.value = '';
            amountInput.value = '';
            renderExpenses();
        }

        function triggerEdit(index) {
            const item = expenses[index];
            editIndex = index;

            const parts = item.date.split('/');
            document.getElementById('selDay').value = parseInt(parts[0]);
            document.getElementById('selMonth').value = parseInt(parts[1]);
            document.getElementById('selYear').value = parseInt(parts[2]);
            
            document.getElementById('expenseName').value = item.name;
            document.getElementById('expenseAmount').value = new Intl.NumberFormat('vi-VN').format(item.amount);
            document.getElementById('expenseCategory').value = item.category;

            const btn = document.getElementById('submitBtn');
            btn.innerText = "✓ Cập nhật Khoản Chi";
            btn.classList.add('update-mode');

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function deleteExpense(index) {
            if(confirm("Xóa khoản chi tiêu này?")) {
                expenses.splice(index, 1);
                
                if (editIndex === index) {
                    document.getElementById('expenseName').value = '';
                    document.getElementById('expenseAmount').value = '';
                    editIndex = -1;
                    const btn = document.getElementById('submitBtn');
                    btn.innerText = "+ Thêm Khoản Chi";
                    btn.classList.remove('update-mode');
                } else if (editIndex > index) {
                    editIndex--; 
                }

                localStorage.setItem('my_expenses_v1', JSON.stringify(expenses));
                renderExpenses();
            }
        }

        initDates();
        renderExpenses();
    </script>
</body>
</html>
